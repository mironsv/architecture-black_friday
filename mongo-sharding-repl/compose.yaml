name: mongo-sharding-repl

services:
  configSvr:
    container_name: configSvr
    image: dh-mirror.gitverse.ru/mongo:latest
    restart: always
    ports:
      - "27017:27017"
    networks:
      app-network:
        ipv4_address: 173.17.0.10
    volumes:
      - configSvr_data:/data/db
    command: > # запуск в режиме конфигурации
      mongod  --configsvr
              --replSet config_server
              --bind_ip_all
              --port 27017
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  # =========================
  # Shard 1 Replica Set (3 nodes)
  # =========================
  mongodb1-1:
    container_name: mongodb1-1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: >
      mongod --shardsvr
             --replSet shard1ReplSet
             --port 27021
             --bind_ip_all
    ports:
      - "27021:27021"
    networks:
      app-network:
        ipv4_address: 173.17.0.9
    volumes:
      - mongodb1_1_data:/data/db

  mongodb1-2:
    container_name: mongodb1-2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: >
      mongod --shardsvr
             --replSet shard1ReplSet
             --port 27022
             --bind_ip_all
    networks:
      app-network:
        ipv4_address: 173.17.0.8
    ports:
      - "27022:27022"
    volumes:
      - mongodb1_2_data:/data/db

  mongodb1-3:
    container_name: mongodb1-3
    image: dh-mirror.gitverse.ru/mongo:latest
    command: >
      mongod --shardsvr
             --replSet shard1ReplSet
             --port 27023
             --bind_ip_all
    ports:
      - "27023:27023"
    networks:
      app-network:
        ipv4_address: 173.17.0.7
    volumes:
      - mongodb1_3_data:/data/db

  # =========================
  # Shard 2 Replica Set (3 nodes)
  # =========================
  mongodb2-1:
    container_name: mongodb2-1
    image: dh-mirror.gitverse.ru/mongo:latest
    command: >
      mongod --shardsvr
             --replSet shard2ReplSet
             --port 27024
             --bind_ip_all
    ports:
      - "27024:27024"
    networks:
      app-network:
        ipv4_address: 173.17.0.6
    volumes:
      - mongodb2_1_data:/data/db

  mongodb2-2:
    container_name: mongodb2-2
    image: dh-mirror.gitverse.ru/mongo:latest
    command: >
      mongod --shardsvr
             --replSet shard2ReplSet
             --port 27025
             --bind_ip_all

    ports:
      - "27025:27025"
    networks:
      app-network:
        ipv4_address: 173.17.0.5
    volumes:
      - mongodb2_2_data:/data/db

  mongodb2-3:
    container_name: mongodb2-3
    image: dh-mirror.gitverse.ru/mongo:latest
    command: >
      mongod --shardsvr
             --replSet shard2ReplSet
             --port 27026
             --bind_ip_all
    ports:
      - "27026:27026"
    networks:
      app-network:
        ipv4_address: 173.17.0.4
    volumes:
      - mongodb2_3_data:/data/db

  # роутер
  mongosRouter:
    image: dh-mirror.gitverse.ru/mongo:latest
    container_name: mongosRouter
    restart: always
    depends_on:
      - configSvr
      - mongodb1-1
      - mongodb1-2
      - mongodb1-3
      - mongodb2-1
      - mongodb2-2
      - mongodb2-3
    ports:
      - "27020:27020"
    networks:
      app-network:
        ipv4_address: 173.17.0.3
    command: > # в режиме роутера, передача данных сервера конфигурации
      mongos  --configdb config_server/configSvr:27017
              --bind_ip_all
              --port 27020
    healthcheck:
      test: [ "CMD", "mongo", "--eval", "db.adminCommand('ping')" ]
      interval: 5s
      start_period: 10s

  pymongo_api:
    container_name: pymongo_api
    build: 
      context: api_app
      dockerfile: Dockerfile
    depends_on:
      - mongosRouter
    ports:
      - 8080:8080
    networks:
      app-network:
        ipv4_address: 173.17.0.2
    environment:
      MONGODB_URL: "mongodb://mongosRouter:27020"
      MONGODB_DATABASE_NAME: "somedb"


volumes:
  configSvr_data:
  mongodb1_1_data:
  mongodb1_2_data:
  mongodb1_3_data:
  mongodb2_1_data:
  mongodb2_2_data:
  mongodb2_3_data:


networks:
  app-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 173.17.0.0/16
